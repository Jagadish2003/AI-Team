name: Contract Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/verify_sprint_10_11.py"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/verify_sprint_10_11.py"

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Seed database
        env:
          DB_PATH: database/dev.db
          SEED_DIR: database/seed
        run: python database/seed_loader.py

      - name: Run contract tests
        env:
          PYTHONPATH: "..:."
          DEV_JWT: dev-token-change-me
          DB_PATH: database/dev.db
          SEED_DIR: database/seed
          CORS_ORIGINS: http://localhost:5173
          AGENTIQ_DISABLE_BACKGROUND_JOBS: "1"
          INGEST_MODE: offline
        run: pytest tests/contract/ -v

      - name: Run Track 3 Sprint 10/11 verification
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: "backend:."
          DEV_JWT: dev-token-change-me
          SEED_DIR: backend/database/seed
          CORS_ORIGINS: http://localhost:5173
          AGENTIQ_DISABLE_BACKGROUND_JOBS: "1"
          INGEST_MODE: offline
        run: python scripts/verify_sprint_10_11.py
