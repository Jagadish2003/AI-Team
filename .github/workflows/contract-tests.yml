name: Contract Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/verify_sprint_10_11.py"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "contracts/**"
      - "scripts/verify_sprint_10_11.py"

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    # Contract tests run against an ephemeral PostgreSQL service. Use fixed
    # throwaway CI credentials here so pull-request checks do not depend on
    # repository secrets being present before the service container can start.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: agentiq_test
          POSTGRES_USER: agentiq
          POSTGRES_PASSWORD: agentiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentiq -d agentiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agentiq:agentiq@localhost:5432/agentiq_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run contract tests
        env:
          PYTHONPATH: "..:."
          DEV_JWT: dev-token-change-me
          SEED_DIR: database/seed
          CORS_ORIGINS: http://localhost:5173
          AGENTIQ_DISABLE_BACKGROUND_JOBS: "1"
          INGEST_MODE: offline
        run: pytest tests/contract/ -v

      - name: Run Track 3 Sprint 10/11 verification
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: "backend:."
          DEV_JWT: dev-token-change-me
          SEED_DIR: backend/database/seed
          CORS_ORIGINS: http://localhost:5173
          AGENTIQ_DISABLE_BACKGROUND_JOBS: "1"
          INGEST_MODE: offline
        run: python scripts/verify_sprint_10_11.py
