services:

  # ── 1. PostgreSQL 18 ──────────────────────────────────────────────────────────
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: agentiq-postgres:1.0
    container_name: agentiq-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-agentiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentiq_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-agentiqprod}
    volumes:
      # postgres:18 expects mount at /var/lib/postgresql (parent).
      # It creates the data/ subdirectory inside, so files land at
      # /opt/aiqstore/postgres/data/ on the host.
      - /opt/aiqstore/postgres:/var/lib/postgresql
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c timezone=UTC
      -c log_timezone=UTC
      -c log_min_duration_statement=500
    networks:
      - agentiq-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentiq} -d ${POSTGRES_DB:-agentiqprod}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── 2. Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentiq-backend:latest
    container_name: agentiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/aiqstore/.env}
    ports:
      - "8000:8000"
    networks:
      - agentiq-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── 3. Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agentiq-frontend:1.0
    container_name: agentiq-frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # SSL certs — bind-mounted read-only from the shared aiqstore path.
      # Replace cert files in /opt/aiqstore/ssl/ and restart the container
      # to pick up renewed certs. When the directory is empty or missing,
      # the 99-select-ssl.sh hook keeps nginx in HTTP-only mode.
      - /opt/aiqstore/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - agentiq-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  agentiq-net:
    driver: bridge
