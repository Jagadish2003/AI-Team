[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = migrations

# Add backend/ to sys.path so app.* and database.* imports resolve.
prepend_sys_path = .

# OS-appropriate path separator for version files.
version_path_separator = os

# Default DB URL — overridden at runtime by env.py using the DB_PATH env var.
# For a PostgreSQL deployment substitute:
#   postgresql+psycopg2://user:pass@host/dbname
sqlalchemy.url = sqlite:///database/dev.db

# ---------------------------------------------------------------------------
# Logging — mirrors the project's uvicorn log level conventions.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
