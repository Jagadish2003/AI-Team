{% extends "base.html" %}
{% block title %}AgentIQ — Admin Login{% endblock %}

{% block head %}
<style>
  .card { max-width: 400px; }
  .form-stack { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 1.5rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  input[type="password"] {
    background: var(--surface-up); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-family: var(--sans);
    font-size: 0.9375rem; padding: 0.65rem 0.875rem; width: 100%; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="password"]:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  input[type="text"] {
    background: var(--surface-up); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-family: var(--sans);
    font-size: 0.9375rem; padding: 0.65rem 0.875rem; width: 100%; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .admin-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-faint);
    background: var(--surface-up); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.15rem 0.5rem;
  }
</style>
{% endblock %}

{% block body %}
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L3 6v8l7 4 7-4V6L10 2z" stroke="white" stroke-width="1.5"
              stroke-linejoin="round" fill="none"/>
        <path d="M10 2v12M3 6l7 4 7-4" stroke="white" stroke-width="1.5"
              stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">AgentIQ <span>/ Deployment</span></div>
  </div>

  <div class="card">
    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:2px">
        <circle cx="8" cy="8" r="7" stroke="#f87171" stroke-width="1.5"/>
        <path d="M8 5v3.5M8 10.5v.5" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
      <h1>Admin Sign In</h1>
      <span class="admin-badge">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <rect x="1" y="4" width="8" height="5.5" rx="1" stroke="currentColor" stroke-width="1.1"/>
          <path d="M3 4V3a2 2 0 014 0v1" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        Restricted
      </span>
    </div>
    <p class="subtitle">Manage client access and license keys.</p>

    <form class="form-stack" method="post" action="/admin/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:0.25rem">
        Sign In
      </button>
    </form>
  </div>

  <p class="page-footer">AgentIQ &nbsp;·&nbsp; Admin Portal</p>
{% endblock %}
